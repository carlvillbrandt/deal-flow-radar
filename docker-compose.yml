services:
  n8n:
    image: n8nio/n8n:2.45.3   # pinned; bump deliberately and re-run the gold set
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set in .env}
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Non-secret config read in workflows via $env
      - SHEET_ID=${SHEET_ID:-}
      - DIGEST_TO=${DIGEST_TO:-}
      - ALERT_TO=${ALERT_TO:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-5-5}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import/workflows:ro
volumes:
  n8n_data:
